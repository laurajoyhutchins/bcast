[package]
name = "bcast-rules"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Source-independent, reviewed building-code rule IR to Rust compiler"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[lib]
name = "bcast_rules"
path = "src/lib.rs"

[[bin]]
name = "bcast-rust"
path = "src/main.rs"
