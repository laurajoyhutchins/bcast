name: Temporary formatting export (read-only source)
on:
  push:
    branches: [chore/normalize-format-gate]
permissions:
  contents: read
jobs:
  format-export:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check ruff==0.13.2
      - name: Format disposable copies and emit checked results
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, subprocess, tempfile, shutil, sys
          tracked = sorted(p for p in subprocess.check_output(['git', 'ls-files', '-z', '--', '*.py']).decode().split('\0') if p)
          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              shutil.copyfile('pyproject.toml', root / 'pyproject.toml')
              for path in tracked:
                  dest = root / path
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(path, dest)
              subprocess.run([sys.executable, '-m', 'ruff', 'format', str(root)], check=True, capture_output=True)
              changed = 0
              for path in tracked:
                  before = Path(path).read_bytes()
                  after = (root / path).read_bytes()
                  if before != after:
                      print('FORMAT_BLOB|' + path + '|' + base64.b64encode(after).decode(), flush=True)
                      changed += 1
              print(f'FORMAT_COUNT|{changed}', flush=True)
          PY
