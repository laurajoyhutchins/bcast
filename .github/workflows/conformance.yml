name: Conformance

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce public repository boundary
        run: python conformance/check_public_boundary.py
      - name: Install public client and conformance dependencies
        run: python -m pip install --disable-pip-version-check -e . -r conformance/requirements.txt
      - name: Run conformance regression tests
        run: python -m unittest conformance.test_conformance conformance.test_public_boundary
      - name: Run public client tests
        run: python -m unittest discover -s tests
      - name: Validate synthetic package
        run: python conformance/validate.py spec/schemas/package-0.1.0.schema.json examples/synthetic/valid/package-0.1.0.json