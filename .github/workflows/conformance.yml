name: Conformance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install conformance dependencies
        run: python -m pip install --disable-pip-version-check -r conformance/requirements.txt
      - name: Run conformance regression tests
        run: python -m unittest conformance.test_conformance
      - name: Validate synthetic package
        run: python conformance/validate.py spec/schemas/package-0.1.schema.json examples/synthetic/package-0.1.json