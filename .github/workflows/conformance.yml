name: Conformance

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce public repository boundary
        run: python conformance/check_public_boundary.py
      - name: Install public client and conformance dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]' -r conformance/requirements.txt
      - name: Run repository lint, conformance, clients and synthetic contracts
        run: python tools/check.py
