name: Temporary GLiNER2.5 Transformers 5.8 runtime bridge
on:
  push:
    branches:
      - agent/gliner25-checkpoint-bridge-20261024
    paths:
      - .github/workflows/gliner25-checkpoint-bridge.yml
permissions:
  contents: read
jobs:
  public-wheel-download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download checkpoint-declared Transformers runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          python -m pip download --disable-pip-version-check --only-binary=:all: -d wheelhouse 'transformers==5.8.0'
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          files=[{'file':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(Path('wheelhouse').glob('*.whl'))]
          assert any(f['file'].startswith('transformers-5.8.0-') for f in files)
          Path('wheelhouse/manifest.json').write_text(json.dumps({'origin':'public PyPI packages for checkpoint Transformers 5.8.0','files':files},indent=2))
          print(files)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gliner25-transformers58-runtime-wheels
          path: wheelhouse/
          retention-days: 1
          if-no-files-found: error
