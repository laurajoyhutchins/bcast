name: Temporary GLiNER2.5 checkpoint bridge

on:
  push:
    branches:
      - agent/gliner25-checkpoint-bridge-20261024
    paths:
      - .github/workflows/gliner25-checkpoint-bridge.yml

permissions:
  contents: read

jobs:
  public-model-download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Python 3.13 for target VM wheels
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download public model and minimal wheels
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'huggingface_hub==0.36.0'
          mkdir -p transfer/model transfer/wheelhouse
          python - <<'PY'
          from huggingface_hub import snapshot_download
          from pathlib import Path
          root = Path('transfer/model')
          snapshot_download(repo_id='fastino/gliner2.5-small-v1', local_dir=root)
          files = [x for x in root.rglob('*') if x.is_file() and '.cache' not in x.parts]
          assert any(x.suffix == '.safetensors' for x in files), 'missing model weights'
          print('Checkpoint files:', len(files), 'bytes:', sum(x.stat().st_size for x in files))
          PY
          python -m pip download --only-binary=:all: --no-deps --dest transfer/wheelhouse \
            'gliner2[local]>=1.3.2,<2' 'transformers>=4.45,<5' tokenizers accelerate \
            outlines outlines_core regex PyYAML filelock fsspec requests tqdm
          python - <<'PY'
          import hashlib,json, pathlib,zipfile
          folder=pathlib.Path('transfer'); items=[]
          for p in sorted(folder.rglob('*')):
              if not p.is_file() or '.cache' in p.parts: continue
              rel=p.relative_to(folder).as_posix()
              items.append({'path':rel,'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          assert any(i['path'].endswith('.safetensors') for i in items)
          with zipfile.ZipFile('gliner25-public-checkpoint-wheels.zip','w',compression=zipfile.ZIP_DEFLATED,compresslevel=1,allowZip64=True) as z:
              z.writestr('manifest.json',json.dumps({'model_id':'fastino/gliner2.5-small-v1','origin':'public Hugging Face repository','files':items},indent=2))
              for i in items: z.write(folder/i['path'],i['path'])
          print('Archive size:',pathlib.Path('gliner25-public-checkpoint-wheels.zip').stat().st_size)
          PY
      - name: Publish short-lived transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gliner25-public-model-and-py313-wheels
          path: gliner25-public-checkpoint-wheels.zip
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
