name: Temporary pinned GLiNER2 source bridge
on:
  push:
    branches: [agent/gliner25-checkpoint-bridge-20261024]
    paths: [.github/workflows/gliner25-checkpoint-bridge.yml]
permissions:
  contents: read
jobs:
  fetch-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch and verify public upstream source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/fastino-ai/GLiNER2.git upstream
          cd upstream
          test "$(git rev-parse HEAD)" = ca4f68235b50fe4c3ecf3876851d748fe4b15c6c
          test -f gliner2/auto.py
          grep -q '"AutoExtractor"' gliner2/__init__.py
          cd ..
          tar czf gliner2-upstream-2.1.0-source.tar.gz -C upstream gliner2 pyproject.toml LICENSE
          sha256sum gliner2-upstream-2.1.0-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: gliner25-pinned-upstream-source
          path: gliner2-upstream-2.1.0-source.tar.gz
          retention-days: 1
          if-no-files-found: error
